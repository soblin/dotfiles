# wezterm
- name: check wezterm version
  # NOTE: the output is like "wezterm 20240203-110809-5046fc22"
  ansible.builtin.command: wezterm --version
  register: wezterm_current
  failed_when: false
  changed_when: false

- name: setup wezterm
  vars:
    wezterm_version: "{{ versions.wezterm.version }}"
    # NOTE: the version is not a semver, so take the last field instead
    wezterm_installed: "{{ (wezterm_current.stdout_lines[0] | default('')).split() | last | default('') }}"
  # install if missing, or if the installed version is not the pinned one
  when: wezterm_installed != wezterm_version
  block:
    - name: dpkg install wezterm
      apt:
        deb: https://github.com/wezterm/wezterm/releases/download/{{ wezterm_version }}/wezterm-{{ wezterm_version }}.Ubuntu22.04.deb
        state: present

- name: verify wezterm version
  ansible.builtin.command: wezterm --version
  register: wezterm_verified
  changed_when: false
  failed_when: (wezterm_verified.stdout_lines[0].split() | last) != versions.wezterm.version
