# difft
- name: check difft version
  # NOTE: the 1st line is like "Difftastic 0.70.0"
  ansible.builtin.command: difft --version
  register: difft_current
  failed_when: false
  changed_when: false

- name: setup difft command
  become: false
  vars:
    difft_version: "{{ versions.difftastic.version }}"
    difft_installed: "{{ difft_current.stdout_lines[0] | default('') | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  # install if missing, or if the installed version is not the pinned one
  when: difft_installed != (difft_version | regex_replace('^v', ''))
  block:
    - name: download difftastic
      ansible.builtin.get_url:
        url: https://github.com/Wilfred/difftastic/releases/download/{{ difft_version }}/difft-x86_64-unknown-linux-gnu.tar.gz
        # NOTE: the version is in the file name because get_url does not
        # re-download when dest already exists
        dest: /tmp/difftastic-{{ difft_version }}.tar.gz

    - name: install difftastic
      ansible.builtin.unarchive:
        src: /tmp/difftastic-{{ difft_version }}.tar.gz
        # NOTE: only contains "difft" file
        dest: "{{ lookup('env','HOME') }}/.local/bin/"

- name: verify difft version
  ansible.builtin.command: difft --version
  register: difft_verified
  changed_when: false
  failed_when: (difft_verified.stdout_lines[0] | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) != (versions.difftastic.version | regex_replace('^v', ''))
