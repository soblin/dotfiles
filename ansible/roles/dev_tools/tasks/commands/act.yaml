# act
- name: check act version
  # NOTE: the output is like "act version 0.2.89"
  ansible.builtin.command: act --version
  register: act_current
  failed_when: false
  changed_when: false

- name: setup act command
  become: false
  vars:
    act_version: "{{ versions.act.version }}"
    act_installed: "{{ act_current.stdout | default('') | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  # install if missing, or if the installed version is not the pinned one
  when: act_installed != (act_version | regex_replace('^v', ''))
  block:
    - name: download act
      ansible.builtin.get_url:
        url: https://github.com/nektos/act/releases/download/{{ act_version }}/act_Linux_x86_64.tar.gz
        # NOTE: the version is in the file name because get_url does not
        # re-download when dest already exists
        dest: /tmp/act-{{ act_version }}.tar.gz

    - name: unarchive act
      ansible.builtin.unarchive:
        src: /tmp/act-{{ act_version }}.tar.gz
        dest: /tmp

    - name: install act
      copy:
        src: /tmp/act
        dest: "{{ lookup('env','HOME') }}/.local/bin/act"
        mode: "0755"

- name: verify act version
  ansible.builtin.command: act --version
  register: act_verified
  changed_when: false
  failed_when: (act_verified.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) != (versions.act.version | regex_replace('^v', ''))
