# ghq
- name: check ghq version
  # NOTE: the output is like "ghq version 1.10.1 (rev:f600896)"
  ansible.builtin.command: ghq --version
  register: ghq_current
  failed_when: false
  changed_when: false

- name: setup ghq command
  become: false
  vars:
    ghq_version: "{{ versions.ghq.version }}"
    ghq_installed: "{{ ghq_current.stdout | default('') | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  # install if missing, or if the installed version is not the pinned one
  when: ghq_installed != (ghq_version | regex_replace('^v', ''))
  block:
    - name: download binary
      ansible.builtin.get_url:
        url: https://github.com/x-motemen/ghq/releases/download/{{ ghq_version }}/ghq_linux_amd64.zip
        # NOTE: the version is in the file name because get_url does not
        # re-download when dest already exists
        dest: /tmp/ghq-{{ ghq_version }}.zip

    - name: unarchive ghq
      ansible.builtin.unarchive:
        src: /tmp/ghq-{{ ghq_version }}.zip
        dest: /tmp/

    - name: install binary
      copy:
        src: /tmp/ghq_linux_amd64/ghq
        dest: "{{ lookup('env','HOME') }}/.local/bin/ghq"
        mode: "0755"

    - name: install bash completion
      copy:
        src: /tmp/ghq_linux_amd64/misc/bash/_ghq
        dest: "{{ lookup('env','HOME') }}/.local/share/bash-completion/completions/ghq"
        mode: "0644"

- name: verify ghq version
  ansible.builtin.command: ghq --version
  register: ghq_verified
  changed_when: false
  failed_when: (ghq_verified.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) != (versions.ghq.version | regex_replace('^v', ''))
