- name: setup docker
  block:
    # apt
    - block:
      - name: get gpg key
        ansible.builtin.get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'

      - name: add repo
        copy:
          dest: /etc/apt/sources.list.d/docker.sources
          content: |
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: {{ ansible_distribution_release }}
            Components: stable
            Signed-By: /etc/apt/keyrings/docker.asc

      - name: install docker if not ci
        when: not is_ci
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present
          update_cache: true

      - name: update apt cache for the docker repo
        when: is_ci
        apt:
          # NOTE: the apt module does not update the cache in check mode, so the
          # freshly added docker repository has to be fetched beforehand
          update_cache: true
        check_mode: false
        changed_when: false

      - name: check docker installability on ci
        when: is_ci
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present
          update_cache: true
        check_mode: true

    # setup docker group
    - block:
      - name: get username
        become: false # if true, `whoami` returns root
        ansible.builtin.command: whoami
        register: username
        failed_when: username.rc != 0
        changed_when: false

      - name: add docker group
        ansible.builtin.group:
          name: docker
          state: present

      - name: check and save if user belongs to docker group
        ansible.builtin.shell: id -nG {{ username.stdout }}
        register: user_groups
        changed_when: false

      - name: add user to docker group
        user:
          name: "{{ username.stdout }}"
          groups: docker
          append: true # "-aG"

      - name: prompt logout
        debug:
          msg: "Please logout once to use docker"
        when: "'docker' not in user_groups.stdout.split()" # "" is necessary
