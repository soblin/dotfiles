- name: install fonts on baremetal
  apt:
    name:
      - fonts-powerline
      - fonts-takao-gothic
      - fonts-takao-pgothic
      - fonts-firacode
    state: present
  when: is_baremetal

- name: check fonts installability on ci
  apt:
    name:
      - fonts-powerline
      - fonts-takao-gothic
      - fonts-takao-pgothic
      - fonts-firacode
    state: present
  when: not is_baremetal
  check_mode: true

- name: install HackGen font
  block:
    - name: download zip file
      ansible.builtin.get_url:
        url: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip
        dest: /tmp/HackGen_NF.zip

    - name: unarchive zip file
      ansible.builtin.unarchive:
        src: /tmp/HackGen_NF.zip
        dest: /usr/local/share/fonts/

    - name: update cache
      ansible.builtin.shell: fc-cache -vf

- name: install Moralerspace font
  block:
    - name: download Moralerspace zip file
      ansible.builtin.get_url:
        url: https://github.com/yuru7/moralerspace/releases/download/v2.0.0/MoralerspaceHW_v2.0.0.zip
        dest: /tmp/MoralerspaceHW.zip

    # HW(半角:全角 = 1:2)のNeonのみ展開する。他のファミリはinclude行を足せば使える
    - name: unarchive Moralerspace zip file
      ansible.builtin.unarchive:
        src: /tmp/MoralerspaceHW.zip
        dest: /usr/local/share/fonts/
        include:
          - MoralerspaceHW_v2.0.0/MoralerspaceNeonHW-Regular.ttf
          - MoralerspaceHW_v2.0.0/MoralerspaceNeonHW-Bold.ttf
          - MoralerspaceHW_v2.0.0/MoralerspaceNeonHW-Italic.ttf
          - MoralerspaceHW_v2.0.0/MoralerspaceNeonHW-BoldItalic.ttf

    - name: update cache after Moralerspace
      ansible.builtin.shell: fc-cache -vf
