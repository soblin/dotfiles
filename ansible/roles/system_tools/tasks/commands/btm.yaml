# btm
- name: check btm version
  # NOTE: the output is like "bottom 0.14.8"
  ansible.builtin.command: btm --version
  register: btm_current
  failed_when: false
  changed_when: false

- name: setup btm command
  vars:
    btm_version: "{{ versions.bottom.version }}"
    btm_installed: "{{ btm_current.stdout | default('') | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  # install if missing, or if the installed version is not the pinned one
  when: btm_installed != btm_version
  block:
    - name: dpkg install btm
      apt:
        # NOTE: "-1" is the debian revision of the release asset
        deb: https://github.com/ClementTsang/bottom/releases/download/{{ btm_version }}/bottom-musl_{{ btm_version }}-1_amd64.deb
        state: present

- name: verify btm version
  ansible.builtin.command: btm --version
  register: btm_verified
  changed_when: false
  failed_when: (btm_verified.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) != versions.bottom.version
