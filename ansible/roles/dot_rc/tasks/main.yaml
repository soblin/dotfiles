- name: backup and symlink rc files and others
  include_tasks: _backup_and_symlink.yaml
  with_items:
    - .bashrc
    - .bash_aliases
    - .profile
    - .dircolors
    - .config/rcs
    - .gitignore
    - .gitconfig
    - .config/peco
    - .config/wezterm
    - .config/autostart
    - .Xmodmap

- name: symlink claude user settings
  include_tasks: _claude_settings.yaml
